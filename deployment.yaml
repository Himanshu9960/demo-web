apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-web-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-web
  template:
    metadata:
      labels:
        app: devops-web
    spec:
      containers:
      - name: web
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: devops-web-service
spec:
  type: LoadBalancer
  selector:
    app: devops-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
