apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-web-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-web
  template:
    metadata:
      labels:
        app: devops-web
    spec:
      imagePullSecrets:
      - name: ecr-secret  # Tells local K8s to use your AWS credentials
      containers:
      - name: web
        image: 543953893133.dkr.ecr.ap-south-1.amazonaws.com/my-devops-app:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: devops-web-service
spec:
  type: NodePort  # Best for local clusters so you can access it via localhost
  selector:
    app: devops-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
